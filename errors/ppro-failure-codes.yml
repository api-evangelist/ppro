generated: '2026-08-26'
method: searched
source: https://developerhub.ppro.com/global-api/reference/ppro-failure-codes
api: PPRO Global API
note: PPRO's decline surface is not an HTTP-status surface. A request can be accepted with a 2xx while the underlying
  authorization, capture, refund or void is declined; the created entity then carries a failure object. This file
  catalogues the failureCode values PPRO publishes, grouped by failureType. It complements errors/ppro-problem-types.yml,
  which covers the transport-level 4xx/5xx envelope.
envelope:
  field: failure
  location: on the created entity in a 2xx response, and mirrored onto the parent payment charge as the most recent
    failure
  fields:
  - name: failureType
    description: 'General category: INTERNAL_ERROR, INTERNAL_DECLINE, PROVIDER_ERROR, PROVIDER_DECLINE'
  - name: failureCode
    description: Optional. Internal PPRO code identifying the specific failure — the values catalogued here.
  - name: providerFailureCode
    description: Optional. Raw failure code returned by the upstream provider. Not published by PPRO; passed through.
  - name: failureMessage
    description: Human-readable message describing the cause.
  - name: isRetryable
    description: Optional. Whether a fresh attempt later may succeed. Not all payment methods support this indication.
failure_types:
- type: INTERNAL_ERROR
  meaning: An unexpected error occurred within PPRO's system.
- type: INTERNAL_DECLINE
  meaning: PPRO determined that the operation should be declined.
- type: PROVIDER_ERROR
  meaning: An error occurred while communicating with an upstream provider.
- type: PROVIDER_DECLINE
  meaning: The upstream provider declined the operation.
masked_to_buyer:
  policy: not-stated
  note: 'PPRO does not publish a masking policy. Several recommended-steps entries do instruct the merchant to show
    the consumer a generic error rather than the reason (for example BLOCKED_IP: "Show a generic error and contact
    PPRO support for details"), which is guidance to the merchant, not a platform-enforced mask.'
