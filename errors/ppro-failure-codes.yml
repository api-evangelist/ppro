- code: REFUND_NOT_SUPPORTED
  failure_type: PROVIDER_DECLINE
  meaning: The specific product, card type, or acquirer rule does not allow refunds for this transaction.
  action: Inform the customer that an automated refund is not possible. Arrange an alternative payment method (e.g.,
    bank transfer).
- code: REFUND_PERIOD_EXPIRED
  failure_type: PROVIDER_DECLINE
  meaning: The transaction is outside the permitted window.
  action: Inform the customer that an automated refund is no longer possible. Arrange an alternative payment method
    (e.g., bank transfer).
- code: RETRY_REFUND_LATER
  failure_type: PROVIDER_DECLINE
  meaning: A temporary communication or system failure occurred during the refund process.
  action: Retry the request after a short interval (e.g., 15–30 minutes). If the issue persists, contact PPRO's
    support team with the transaction ID.
- code: SUS_FRAUD
  failure_type: PROVIDER_DECLINE
  meaning: The payment was declined because the issuer or provider suspects it was fraudulent.
  action: The consumer should not be informed about the reason for the decline, and should see only a generic error
    message.
- code: SUS_LOST
  failure_type: PROVIDER_DECLINE
  meaning: The payment was declined because the consumer's card was reported lost.
  action: The consumer should not be informed about the reason for the decline, and should see only a generic error
    message.
- code: SUS_STOLEN
  failure_type: PROVIDER_DECLINE
  meaning: The payment was declined because the consumer's card was reported stolen.
  action: The consumer should not be informed about the reason for the decline, and should see only a generic error
    message.
- code: TRANSACTION_DISPUTED
  failure_type: PROVIDER_DECLINE
  meaning: The transaction has an open chargeback or is blocked due to an existing dispute.
  action: Refunds cannot be processed while a chargeback is active.
- code: UNKNOWN
  failure_type: PROVIDER_DECLINE
  meaning: The acquirer rejected the payment charge or refund with a code that is not currently mapped in our system.
  action: Contact PPRO's support team with the transaction ID to identify the specific acquirer response.
- code: UNRESPONSIVE_ISSUER
  failure_type: PROVIDER_ERROR
  meaning: The issuer cannot be contacted/is unavailable.
  action: Retry the request. If you receive this failure code repeatedly, ask the consumer to contact their issuer
    to receive more information and resolve the problem.
- code: UNRESPONSIVE_PROVIDER
  failure_type: PROVIDER_ERROR
  meaning: The provider cannot be contacted/is unavailable.
  action: Retry the request. If you receive this failure code repeatedly, there may be an incident / unscheduled
    maintenance being done by the provider. In general, PPRO will inform you if we detect any provider intermittencies.
- code: PROVIDER_PROCESSING_ERROR
  failure_type: PROVIDER_ERROR
  meaning: The provider could not process the request we sent to them. These errors are very rare.
  action: This could be caused either by a bug on the provider side, or a bug in the way PPRO formats the request
    to the provider. These errors are very rare and we work to get them fixed as soon as possible when they arise.
