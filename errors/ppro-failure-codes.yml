- code: IS_GENERIC_DECLINE
  failure_type: PROVIDER_DECLINE
  meaning: Generic decline by the issuer.
  action: The consumer should contact their issuer to receive more information and resolve the problem.
- code: IS_HIGH_VELOCITY
  failure_type: PROVIDER_DECLINE
  meaning: The consumer has exceeded the number of attempts allowed by the issuer.
  action: The consumer should contact their issuer to receive more information and resolve the problem.
- code: IS_NOT_PERMITTED
  failure_type: PROVIDER_DECLINE
  meaning: Not permitted by the issuer.
  action: The consumer should contact their issuer to receive more information and resolve the problem.
- code: REFUND_BLOCKED_TEMPORARILY
  failure_type: PROVIDER_DECLINE
  meaning: The request is blocked due to temporary operational limits, queuing, or rate-limiting at the acquirer.
  action: Do not retry immediately. Wait 1 day before retrying it. If the issue persists, contact PPRO's support
