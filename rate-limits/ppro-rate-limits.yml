response_headers:
- header: X-RateLimit-Remaining
  meaning: Tokens currently available — how many requests can be made immediately before requests are refused.
- header: X-RateLimit-Requested-Tokens
  meaning: Tokens consumed by this request. Each request costs one token.
- header: X-RateLimit-Burst-Capacity
  meaning: Maximum tokens the bucket can hold — the largest burst possible when the bucket is full.
- header: X-RateLimit-Replenish-Rate
  meaning: Tokens refilled per second — the sustained rate that can be maintained over time.
