note: 'Every one of the 28 MCP tools binds one-to-one to a published OpenAPI operationId, so there are no MCP-only
  tools. The divergence runs the other way: 35 REST operations — fund statuses, disputes, chargebacks, dispute reports,
  merchant onboarding and payment-method enrollment — have no MCP tool, and PPRO says so plainly in its MCP docs
  ("Currently, interactions with the following APIs are supported, we are working on adding more APIs and endpoints").'
