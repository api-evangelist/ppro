          type: string
          description: The merchant payment agreement reference.
          example: 5c019979-0751-469e-96e0-b67f1d95c577
        frequency:
          $ref: '#/components/schemas/Frequency'
          description: The frequency of payment charges
        startDate:
          type: string
          format: date-time
          description: The start date of the agreement
          example: '2023-03-26T20:24:27+00:00'
        endDate:
          type: string
          format: date-time
          description: The end date of the agreement
          example: '2023-11-27T09:30:00+00:00'
        amount:
          $ref: '#/components/schemas/Money'
          description: Defines the amount of each subsequent payment charge. Defined in conjunction with 'amountType'.
        amountType:
          type: string
          description: Defines if the provided 'amount' is a maximum value or an exact value.
          enum:
          - MAX
          - EXACT
          - VARIABLE
        instrumentId:
          type: string
          description: The identifier of an existing payment instrument. Instruments are used for account on file payments.
          example: instr_SNaRMvhYNFpXhEhgTVSed
        instrument:
          description: The payment instrument
          oneOf:
          - $ref: '#/components/schemas/BancontactAccountInstrument'
          - $ref: '#/components/schemas/BankAccountInstrument'
          - $ref: '#/components/schemas/CardNetworkTokenInstrument'
          - $ref: '#/components/schemas/MockInstrument'
          - $ref: '#/components/schemas/PassthroughWalletInstrument'
          - $ref: '#/components/schemas/UpiAutopayInstrument'
          - $ref: '#/components/schemas/RawCardInstrument'
        paymentSessionId:
          type: string
          description: The identifier of the associated payment-session. Payment-sessions are created by the drop-in UI.
          example: sess_hb8BQ2kbhpHRmE29T6ajx
        consumer:
          $ref: '#/components/schemas/Consumer'
          description: The consumer details.
        webhooksUrl:
          type: string
          description: The URL to which the agreement state changes will be notified
          pattern: ^(https)://[-a-zA-Z0-9+&@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&@#/%=~_|]
        initialPaymentCharge:
          $ref: '#/components/schemas/PaymentCharge'
          description: An initial payment charge to be created when initializing the agreement in a "link and pay" journey
        authenticationSettings:
          type: array
          description: The authorization authentication settings.
          items:
            discriminator:
              propertyName: type
              mapping:
                REDIRECT: '#/components/schemas/RedirectAuthenticationSettings'
                EXTERNAL_3DS: '#/components/schemas/ExternalThreeDsAuthenticationSettings'
                3DS: '#/components/schemas/ThreeDsAuthenticationSettings'
                SCAN_CODE: '#/components/schemas/ScanCodeAuthenticationSettings'
                APP_NOTIFICATION: '#/components/schemas/AppNotificationAuthenticationSettings'
                MULTI_FACTOR: '#/components/schemas/MultiFactorAuthenticationSettings'
            oneOf:
            - allOf:
              - $ref: '#/components/schemas/RedirectAuthenticationSettings'
              title: Authentication Settings
            - allOf:
              - $ref: '#/components/schemas/ExternalThreeDsAuthenticationSettings'
              title: Authentication Settings
            - allOf:
              - $ref: '#/components/schemas/ThreeDsAuthenticationSettings'
              title: Authentication Settings
            - allOf:
              - $ref: '#/components/schemas/ScanCodeAuthenticationSettings'
              title: Authentication Settings
            - allOf:
              - $ref: '#/components/schemas/AppNotificationAuthenticationSettings'
              title: Authentication Settings
            - allOf:
              - $ref: '#/components/schemas/MultiFactorAuthenticationSettings'
              title: Authentication Settings
        initialSchemeAuthorizationReference:
          type: string
          description: The initial scheme authorization reference, eg. for cards network transaction identifier (NTI)
          example: XPTO
        initialTransactionLinkReference:
          type: string
          description: 'Transaction Link Reference or Id (ex: Mastercard TLID) is a unique identifier for a transaction, used by some card networks for transaction chain linking, this is in addition to Network Transaction Identifiers. Provide the initial TLID when creating the subsequent Merchant-Initiated-Transactions.'
          example: atf3_8msFoZ6klReRDlQwn
        labels:
          type: object
          additionalProperties:
            type: string
            example: GTM_Campaign
            maxLength: 200
          description: Custom labels associated with the payment agreement.
          maxProperties: 50
          propertyNames:
            type: string
            example: consumer_origin
            maxLength: 50
          title: Add Labels
      required:
      - consumer
      - paymentMethod
    AirlineIndustryData:
