          example: '007123456'
        holderName:
          type: string
          description: The account holder name.
          example: John Doe
        iban:
          type: string
          description: The IBAN.
          example: DE75512108001245126199
        swiftCode:
          type: string
          description: The SWIFT code.
          example: DEUTDEFF123
        bankName:
          type: string
          description: The bank name.
          example: My Bank
        bankCode:
          type: string
          description: The bank code.
          example: '12341234'
        debitMandateId:
          type: string
          description: The reference id for a mandate that allows debit charges on the bank account.
        debitMandateIdMigrated:
