  contract_location: https://developerhub.ppro.com/global-api/docs/paybybank
- id: iso-20022
  conforms: false
  evidence: >-
    No ISO 20022 message types, no pain./pacs./camt. shapes anywhere in the eleven specs. PPRO's contract is a
