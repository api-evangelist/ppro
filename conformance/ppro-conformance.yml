  contract_location: openapi/ppro-payment-agreements-openapi.yml, https://developerhub.ppro.com/global-api/docs/network-tokens
- id: open-banking-payments
  conforms: partial
  evidence: >-
    Pay By Bank is documented as an Open Banking Payments method (added April 2026), and PPRO operates
    regulated entities in the UK and EU. No PSD2/OBIE/Berlin Group API conformance is claimed — PPRO is the
    consumer of those rails, and exposes its own proprietary contract to merchants rather than an OBIE-shaped
