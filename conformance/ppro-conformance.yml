compliance_programs:
  trust_center:
    present: true
    url: https://trust.ppro.com/
    vendor: Vanta
    http_status: 200
    title: PPRO Trust Center
    certifications_readable: false
    note: >-
      The trust center exists and returns 200, but the report body is rendered client-side by Vanta and the
      underlying API returns 401 to an anonymous caller, so NO certification could be read. No SOC 2, ISO 27001
      or PCI DSS attestation is asserted here because none was verified. This is why no Compliance pointer is
      wired in apis.yml — a TrustCenter pointer records the surface that was verified, and nothing more.
  regulatory:
    note: >-
      PPRO's privacy notice names PPRO Financial Ltd and PPRO Payment Services S.A. with regulatory
      registration numbers, and its data-protection terms reference GDPR, the UK Data Protection Act 2018 and
      the CPRA. These are corporate/legal facts read from the legal pages, not API-contract conformance, and
      are recorded here for context only.
    source: https://www.ppro.com/legal/privacy-notice/
