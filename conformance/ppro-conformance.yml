domain_standards:
- id: pci-dss
  conforms: unstated
  evidence: >-
    PPRO does not name a PCI DSS level anywhere in the public developer hub. The only PCI language published is
    a SCOPE statement about the integrator: the Drop-in Checkout holds card number and CVV in PPRO-hosted
    iframes "so your integration stays out of PCI scope". That is an architectural claim about the merchant,
    not a certification claim about PPRO, and it is recorded as such rather than upgraded.
  contract_location: https://developerhub.ppro.com/global-api/docs/drop-in-checkout
- id: sepa-direct-debit
  conforms: true
  evidence: >-
    SEPA Direct Debit is implemented as a first-class payment method with mandate semantics — SEPA Direct
    Debit, Managed Mandate and their recurring variants each have their own documented flow, and the
    instrument schemas carry a Debit Mandate Id on the bank-account instrument.
  contract_location: openapi/ppro-payment-agreements-openapi.yml (BankAccountInstrumentDetailsRequest), https://developerhub.ppro.com/global-api/docs/sepa-direct-debit
- id: emv-3ds
  conforms: true
  evidence: >-
    EXTERNAL_3DS is a published authentication flow and the webhook/charge schemas declare
    ThreeDsAuthenticationMethodRequest and ThreeDsAuthenticationMethodDetailsRequest.
  contract_location: openapi/ppro-webhooks-openapi.yml (ThreeDsAuthenticationMethodRequest), https://developerhub.ppro.com/global-api/docs/external_3ds
- id: card-network-tokenisation
