standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    All eleven published documents declare openapi 3.1.0 and parse cleanly; the webhook document uses the 3.1
    top-level webhooks object for 30 event definitions.
- id: cloudevents-1.0.2
  conforms: true
  evidence: >-
    "all PPRO webhooks follow the CloudEvents 1.0.2 specification" — webhooks guide. The webhook request
    bodies in openapi/ppro-webhooks-openapi.yml carry specversion (example 1.0.2), source, datacontenttype,
    id, type, subject, time and data, which is the CloudEvents structured JSON envelope.
- id: rfc9727-api-catalog
  conforms: true
  evidence: >-
    https://developerhub.ppro.com/.well-known/api-catalog returns application/linkset+json (HTTP 200) with
    anchor / service-desc / service-doc members, and the global-api sub-catalog names a service-desc of type
    application/vnd.oai.openapi+json for every one of the eleven specifications.
- id: idempotency
  conforms: true
  evidence: >-
    Request-Idempotency-Key on POST and PATCH, UUIDv4 keys, 24-hour retention, Request-Idempotency response
    header on replay, 409 on in-flight or body-mismatch replay. 47 declared 409 responses across the specs.
    Note this is PPRO's own header name, not the IETF draft Idempotency-Key.
  standard_header: false
  standard_header_note: The IETF idempotency draft uses Idempotency-Key; PPRO uses Request-Idempotency-Key.
- id: iso-8601
  conforms: true
  evidence: All date-time fields are YYYY-MM-DDTHH:mm:ss.sssZ in UTC — data standards page.
- id: iso-4217
  conforms: true
  evidence: >-
    Currency codes are ISO 4217 three-letter codes and amounts are integers in the currency's ISO 4217 minor
    unit — data standards page, and the MoneyRequest schema in the specs.
- id: rfc9457
  conforms: false
  evidence: >-
