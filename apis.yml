- name: PPRO Onboarding API
  description: 'Merchant boarding and enrollment for PPRO platforms and PSPs — create and amend
    merchants, people, platforms and PSP records, and enroll merchants onto payment methods. The
    boarding contract publishes only the sandbox server block; PPRO''s own authentication reference
    names https://api.eu.ppro.com as the live host for the platform, and production boarding access is
    arranged through a PPRO account manager.'
  humanURL: https://developerhub.ppro.com/global-api/reference
