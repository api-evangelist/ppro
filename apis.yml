apis:
- name: PPRO Global API
  description: 'PPRO''s current-generation REST payments platform. Payment charges, payment instruments,
    payment agreements and payment sessions are the four core objects; captures, refunds and voids are
    sub-resources of a charge; fund statuses, disputes, chargebacks and dispute reports complete the
    money-movement and risk surface. All requests are Bearer-token authenticated, POST and PATCH accept
    a Request-Idempotency-Key, and every asynchronous state change is delivered as a CloudEvents 1.0.2
    webhook.'
  humanURL: https://developerhub.ppro.com/global-api/docs/welcome
