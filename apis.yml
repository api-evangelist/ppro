aid: ppro
name: PPRO
description: 'PPRO is a local payments infrastructure company that lets payment service providers,
  acquirers, platforms and enterprise merchants accept the payment methods consumers actually use in
  their own market — bank redirects such as iDEAL, BLIK, Przelewy24 and Pay By Bank, wallets such as
  Alipay, WeChat Pay, Amazon Pay, Cash App Pay, TWINT and Swish, cash and voucher rails such as Boleto,
  OXXO, Multibanco and Indomaret, SEPA Direct Debit, Pix, UPI, BNPL and stablecoins — through a single
  REST integration. The PPRO Global API is an OpenAPI 3.1 platform built around four core objects
  (payment charges, payment instruments, payment agreements and payment sessions) plus captures,
  refunds, voids, fund statuses, disputes and chargebacks, with CloudEvents 1.0.2 webhooks, an
  idempotency-key contract, a documented token-bucket rate limit, a Drop-in Checkout component library
  and a hosted Model Context Protocol server so coding agents can call the platform directly.'
url: https://raw.githubusercontent.com/api-evangelist/ppro/refs/heads/main/apis.yml
image: https://files.readme.io/920bf80-ppro_logo_black.svg
